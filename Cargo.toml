[package]
name = "zed-unity"
version = "0.3.0"
authors = ["Sharif Bayoumy <contact@sharifbayoumy.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
members = ["crates/uss-language-server"]
default-members = ["."]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
