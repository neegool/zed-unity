name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    extension:
        name: Build Zed extension
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-wasip2
            - run: cargo build --release --target wasm32-wasip2
            - name: Package extension
              run: tar -czf zed-unity-extension.tar.gz extension.toml languages src Cargo.toml Cargo.lock target/wasm32-wasip2/release/zed_unity.wasm
            - uses: actions/upload-artifact@v4
              with:
                  name: zed-unity-extension
                  path: zed-unity-extension.tar.gz

    uss-language-server:
        name: Build USS language server (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-latest
                      name: linux-x64
                      ext: ""
                      archive: tar.gz
                    - target: aarch64-unknown-linux-gnu
                      os: ubuntu-latest
                      name: linux-arm64
                      ext: ""
                      archive: tar.gz
                    - target: x86_64-apple-darwin
                      os: macos-14
                      name: darwin-x64
                      ext: ""
                      archive: tar.gz
                    - target: aarch64-apple-darwin
                      os: macos-latest
                      name: darwin-arm64
                      ext: ""
                      archive: tar.gz
                    - target: x86_64-pc-windows-msvc
                      os: windows-latest
                      name: win-x64
                      ext: ".exe"
                      archive: zip
        defaults:
            run:
                working-directory: crates/uss-language-server
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Install Linux ARM64 cross compiler
              if: matrix.target == 'aarch64-unknown-linux-gnu'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu
                  echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            - run: cargo build --release --target ${{ matrix.target }}
            - name: Package Unix
              if: runner.os != 'Windows'
              run: |
                  cd target/${{ matrix.target }}/release
                  tar -czf ../../../uss-language-server-${{ matrix.name }}.tar.gz uss-language-server${{ matrix.ext }}
            - name: Package Windows
              if: runner.os == 'Windows'
              run: |
                  cd target/${{ matrix.target }}/release
                  7z a ../../../uss-language-server-${{ matrix.name }}.zip uss-language-server${{ matrix.ext }}
            - uses: actions/upload-artifact@v4
              with:
                  name: uss-language-server-${{ matrix.name }}
                  path: crates/uss-language-server/uss-language-server-${{ matrix.name }}.*

    release:
        name: Create GitHub release
        needs: [extension, uss-language-server]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
            - name: List artifacts
              run: find artifacts -type f
            - uses: softprops/action-gh-release@v2
              with:
                  files: artifacts/**/*
